<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Vision - Vehicle Box & Human Skeleton</title>
    
    <!-- Load TensorFlow.js Core and WebGL Backend -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.10.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.10.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.10.0"></script>
    
    <!-- Load Models -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.0"></script>

    <style>
        :root {
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #00f2fe;
            --danger-color: #ff4b2b;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Container & Media layers - FIXED LAYOUT */
        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #111; /* Fallback color */
        }

        #webcam, #output-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Đảm bảo video và canvas đồng nhất tỷ lệ */
        }

        #webcam {
            z-index: 1;
        }

        #output-canvas {
            z-index: 10;
            pointer-events: none; /* Let clicks pass through */
        }

        /* Glassmorphism Dashboard */
        .dashboard {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            width: 320px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .dashboard-header {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            background-color: var(--danger-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--danger-color);
            transition: background-color 0.3s;
        }
        
        .status-indicator.active {
            background-color: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            font-weight: 500;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: opacity 0.5s;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--glass-border);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            color: var(--danger-color);
            margin-top: 10px;
            text-align: center;
            font-size: 0.9rem;
            background: rgba(255, 75, 43, 0.1);
            padding: 10px;
            border-radius: 8px;
        }
        
        .fps-counter {
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- FIXED: Thêm webkit-playsinline cho iOS/Safari -->
        <video id="webcam" autoplay playsinline webkit-playsinline muted></video>
        <canvas id="output-canvas"></canvas>

        <div class="dashboard">
            <div class="dashboard-header">
                <span>AI Vision Control</span>
                <div id="system-status" class="status-indicator"></div>
            </div>
            
            <div class="info-row">
                <span class="info-label">FPS</span>
                <span class="info-value fps-counter" id="fps-value">0</span>
            </div>
            <div class="info-row">
                <span class="info-label">Camera</span>
                <span class="info-value" id="camera-status">Initializing...</span>
            </div>
            <div class="info-row">
                <span class="info-label">COCO-SSD (Vehicles)</span>
                <span class="info-value" id="coco-status">Loading...</span>
            </div>
            <div class="info-row">
                <span class="info-label">MoveNet (Skeleton)</span>
                <span class="info-value" id="pose-status">Loading...</span>
            </div>

            <div id="error-box" class="error-message"></div>
        </div>

        <div id="loading" class="loading-overlay">
            <div class="spinner"></div>
            <h2>Khởi tạo AI System...</h2>
            <p style="color: var(--text-muted); margin-top: 10px;">Vui lòng cấp quyền Camera</p>
        </div>
    </div>

    <script>
        /**
         * System Configuration & State
         */
        const CONFIG = {
            targetVehicleClasses: ['car', 'motorcycle', 'bus', 'truck'],
            colors: {
                car: '#00f2fe',
                motorcycle: '#ff0844',
                bus: '#f6d365',
                truck: '#fdc830',
                skeleton: '#00ff88',
                keypoint: '#ffffff'
            },
            scoreThreshold: 0.5
        };

        const STATE = {
            models: { objectDetection: null, poseDetection: null },
            isVideoReady: false,
            isDetecting: false,
            lastFrameTime: 0,
            frameCount: 0,
            fps: 0
        };

        // DOM Elements
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output-canvas');
        const ctx = canvas.getContext('2d');
        const loadingOverlay = document.getElementById('loading');
        const errorBox = document.getElementById('error-box');

        /**
         * Initialize Camera Feed
         */
        async function setupCamera() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('Trình duyệt không hỗ trợ API Camera.');
                }
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                
                video.srcObject = stream;
                
                return new Promise((resolve, reject) => {
                    // FIXED: Đổi onloadedmetadata thành onloadeddata để đảm bảo frame đầu tiên đã load
                    video.onloadeddata = async () => {
                        try {
                            await video.play(); // Đảm bảo video thực sự được play
                            resizeCanvas();
                            STATE.isVideoReady = true;
                            document.getElementById('camera-status').textContent = 'Ready';
                            document.getElementById('camera-status').style.color = '#00ff88';
                            resolve();
                        } catch (playError) {
                            reject(new Error("Trình duyệt chặn Autoplay. Hãy tải lại trang."));
                        }
                    };
                    
                    video.onerror = () => {
                        reject(new Error("Lỗi tải luồng Video."));
                    };
                });
            } catch (err) {
                showError(`Lỗi Camera: ${err.message}`);
                throw err;
            }
        }

        /**
         * Resize Canvas to match Video dimensions and handle window resize
         */
        function resizeCanvas() {
            // FIXED: Lấy độ phân giải gốc của video thay vì kích thước CSS
            // CSS object-fit: cover sẽ tự động đồng bộ hiển thị
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        /**
         * Load AI Models concurrently
         */
        async function loadModels() {
            try {
                await tf.ready();
                await tf.setBackend('webgl');
                
                const [cocoModel, poseDetector] = await Promise.all([
                    cocoSsd.load({ base: 'lite_mobilenet_v2' }),
                    poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, {
                        modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
                    })
                ]);
                
                STATE.models.objectDetection = cocoModel;
                STATE.models.poseDetection = poseDetector;
                
                document.getElementById('coco-status').textContent = 'Ready';
                document.getElementById('coco-status').style.color = '#00ff88';
                document.getElementById('pose-status').textContent = 'Ready';
                document.getElementById('pose-status').style.color = '#00ff88';
                
            } catch (err) {
                showError(`Lỗi Model: ${err.message}`);
                throw err;
            }
        }

        /**
         * Draw Vehicle Bounding Box
         */
        function drawVehicles(predictions) {
            predictions.forEach(prediction => {
                if (CONFIG.targetVehicleClasses.includes(prediction.class) && prediction.score > CONFIG.scoreThreshold) {
                    const [x, y, width, height] = prediction.bbox;
                    const color = CONFIG.colors[prediction.class] || '#ffffff';
                    
                    // Box
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 4;
                    ctx.strokeRect(x, y, width, height);
                    
                    // Label Background
                    ctx.fillStyle = color;
                    const text = `${prediction.class} (${Math.round(prediction.score * 100)}%)`;
                    const textWidth = ctx.measureText(text).width;
                    ctx.fillRect(x, y - 25, textWidth + 10, 25);
                    
                    // Label Text
                    ctx.fillStyle = '#000000';
                    ctx.font = '16px -apple-system, sans-serif';
                    ctx.fontWeight = 'bold';
                    ctx.fillText(text, x + 5, y - 7);
                }
            });
        }

        /**
         * Draw Human Skeleton and Keypoints
         */
        function drawSkeletons(poses) {
            poses.forEach(pose => {
                if (!pose.keypoints) return;
                
                const adjacentKeyPoints = poseDetection.util.getAdjacentPairs(poseDetection.SupportedModels.MoveNet);
                
                // Draw bones
                ctx.strokeStyle = CONFIG.colors.skeleton;
                ctx.lineWidth = 3;
                adjacentKeyPoints.forEach(([i, j]) => {
                    const kp1 = pose.keypoints[i];
                    const kp2 = pose.keypoints[j];
                    
                    if (kp1.score > 0.3 && kp2.score > 0.3) {
                        ctx.beginPath();
                        ctx.moveTo(kp1.x, kp1.y);
                        ctx.lineTo(kp2.x, kp2.y);
                        ctx.stroke();
                    }
                });

                // Draw joints
                ctx.fillStyle = CONFIG.colors.keypoint;
                pose.keypoints.forEach(kp => {
                    if (kp.score > 0.3) {
                        ctx.beginPath();
                        ctx.arc(kp.x, kp.y, 5, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                });
            });
        }

        /**
         * Update FPS Counter
         */
        function updateFPS(now) {
            if (STATE.lastFrameTime === 0) {
                STATE.lastFrameTime = now;
                return;
            }
            STATE.frameCount++;
            const delta = now - STATE.lastFrameTime;
            if (delta >= 1000) {
                STATE.fps = (STATE.frameCount * 1000) / delta;
                document.getElementById('fps-value').textContent = Math.round(STATE.fps);
                STATE.frameCount = 0;
                STATE.lastFrameTime = now;
            }
        }

        /**
         * Main Detection Loop
         */
        async function detectFrame(now) {
            if (!STATE.isVideoReady || !STATE.models.objectDetection || !STATE.models.poseDetection) return;
            
            updateFPS(now);
            
            // Clear previous canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            try {
                // Run models concurrently for better performance
                const [objectPredictions, posePredictions] = await Promise.all([
                    STATE.models.objectDetection.detect(video),
                    STATE.models.poseDetection.estimatePoses(video)
                ]);
                
                drawVehicles(objectPredictions);
                drawSkeletons(posePredictions);
            } catch (err) {
                console.error("Lỗi trong quá trình detect:", err);
            }
            
            requestAnimationFrame(detectFrame);
        }

        /**
         * Error Handling UI
         */
        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
            console.error(msg);
        }

        /**
         * Application Bootstrap
         */
        async function bootstrap() {
            try {
                await setupCamera();
                await loadModels();
                
                // Hide loading overlay smoothly
                loadingOverlay.style.opacity = '0';
                setTimeout(() => { loadingOverlay.style.display = 'none'; }, 500);
                
                // System active UI
                document.getElementById('system-status').classList.add('active');
                
                // Start detection loop
                requestAnimationFrame(detectFrame);
            } catch (err) {
                showError("Khởi tạo hệ thống thất bại. Kiểm tra console.");
            }
        }

        // Start app when window loads
        window.onload = bootstrap;
        
    </script>
</body>
</html>
